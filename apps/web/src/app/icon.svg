<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Telar: four threads cross five days; where a thread is free it rides on
       top, where it is busy it dives (a thin under-thread). The middle column,
       where every thread is on top, is the closed band: the day the group meets.
       Drawn inside the maskable safe zone (radius 204 around the centre). -->
