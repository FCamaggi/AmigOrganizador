  <rect x="100" y="160" width="312" height="10" rx="5" fill="#40455f"/>
  <rect x="100" y="147" width="56" height="36" rx="18" fill="#5b7fd6"/>
  <rect x="228" y="147" width="56" height="36" rx="18" fill="#5b7fd6"/>
  <rect x="292" y="147" width="56" height="36" rx="18" fill="#5b7fd6"/>
  <rect x="100" y="214" width="312" height="10" rx="5" fill="#40455f"/>
  <rect x="164" y="201" width="56" height="36" rx="18" fill="#d9a12a"/>
  <rect x="228" y="201" width="56" height="36" rx="18" fill="#d9a12a"/>
  <rect x="356" y="201" width="56" height="36" rx="18" fill="#d9a12a"/>
  <rect x="100" y="268" width="312" height="10" rx="5" fill="#40455f"/>
  <rect x="100" y="255" width="56" height="36" rx="18" fill="#5fae84"/>
  <rect x="164" y="255" width="56" height="36" rx="18" fill="#5fae84"/>
  <rect x="228" y="255" width="56" height="36" rx="18" fill="#5fae84"/>
  <rect x="356" y="255" width="56" height="36" rx="18" fill="#5fae84"/>
  <rect x="100" y="322" width="312" height="10" rx="5" fill="#40455f"/>
  <rect x="100" y="309" width="56" height="36" rx="18" fill="#d46a98"/>
