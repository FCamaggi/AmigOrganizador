  <rect x="292" y="309" width="56" height="36" rx="18" fill="#d46a98"/>
  <rect x="356" y="309" width="56" height="36" rx="18" fill="#d46a98"/>
  <rect x="216" y="131" width="80" height="230" rx="26" fill="none" stroke="#fbfbfa" stroke-width="12"/>
