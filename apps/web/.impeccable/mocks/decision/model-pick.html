<!doctype html><html lang="es-CL"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#f7f6f2;color:#1b1b2f;font-family:Archivo,sans-serif}
.top{padding:18px 20px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:500}
h1{font-weight:900;font-size:38px;line-height:.95;padding:16px 20px 6px;letter-spacing:-.03em}
.meta{padding:0 20px;font-size:15px}
.sheet{position:relative;margin:22px 20px 0;height:330px;background:#fff;border-radius:6px;overflow:hidden}
.ink{position:absolute;left:0;right:0;mix-blend-mode:multiply;opacity:.78}
.k{position:absolute;top:0;bottom:0;width:62px;left:166px;border:3px solid #1b1b2f}
.lbl{position:absolute;left:150px;top:132px;background:#1b1b2f;color:#fff;font-weight:800;font-size:18px;padding:6px 10px}
.axis{display:flex;justify-content:space-between;padding:8px 22px 0;font-size:12px;font-weight:800}
.list{margin:20px 20px 0;font-size:16px}
.list div{display:flex;justify-content:space-between;padding:12px 0;border-top:2px solid #1b1b2f}
.cta{position:absolute;left:20px;right:20px;bottom:22px;height:54px;background:#ff4f8b;color:#1b1b2f;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="top"><span>‹ Grupos</span><span>Invitar</span></div>
<h1>Pichanga de los jueves</h1>
<p class="meta">7 personas · 6 con horario</p>
<div class="sheet">
<div class="ink" style="top:20px;height:120px;background:linear-gradient(90deg,#ff4f8b 0 30%,transparent 30% 42%,#ff4f8b 42% 100%)"></div>
<div class="ink" style="top:70px;height:120px;background:linear-gradient(90deg,transparent 0 20%,#1f7ae0 20% 70%,transparent 70% 80%,#1f7ae0 80%)"></div>
<div class="ink" style="top:130px;height:120px;background:linear-gradient(90deg,#ffd400 0 60%,transparent 60% 75%,#ffd400 75%)"></div>
<div class="ink" style="top:190px;height:120px;background:linear-gradient(90deg,transparent 0 35%,#ff4f8b 35% 65%,transparent 65%)"></div>
<div class="k"></div><div class="lbl">Sáb 12 · 19:00</div>
</div>
<div class="axis"><span>JU</span><span>VI</span><span>SÁ</span><span>DO</span><span>LU</span><span>MA</span><span>MI</span></div>
<div class="list"><div><b>Sáb 12 · 19:00</b><span>6 de 7</span></div><div><b>Vie 18 · 20:00</b><span>5 de 7</span></div></div>
<div class="cta">Proponer el sábado 12</div>
</body></html>
