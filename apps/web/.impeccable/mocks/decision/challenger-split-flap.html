<!doctype html><html lang="es-CL"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#1a1a1a;color:#f2f2ee;font-family:Barlow,sans-serif}
.top{padding:18px 20px 0;display:flex;justify-content:space-between;font-size:14px;color:#bdbdb6}
h1{font-family:'Barlow Condensed';font-weight:700;font-size:36px;padding:14px 20px 2px;text-transform:uppercase}
.meta{padding:0 20px;font-size:15px;color:#bdbdb6}
.board{margin:20px 12px 0;background:#2a2a2a;border:3px solid #555;border-radius:6px;padding:8px}
.hd,.r{display:grid;grid-template-columns:62px 62px 52px 1fr;gap:6px;align-items:center}
.hd{font-size:11px;color:#bdbdb6;padding:2px 4px 6px;letter-spacing:.08em}
.r{padding:5px 4px;border-top:1px solid #444}
.f{background:#111;border-radius:3px;font-family:'Barlow Condensed';font-weight:700;font-size:21px;text-align:center;padding:4px 0;position:relative}
.f:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
.s{font-size:13px;font-weight:700}
.ok{color:#7fd17f}.am{color:#f2a900}
.cta{position:absolute;left:20px;right:20px;bottom:22px;height:52px;border-radius:6px;background:#f2a900;color:#111;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="top"><span>‹ Grupos</span><span>Invitar</span></div>
<h1>Pichanga de los jueves</h1>
<p class="meta">7 personas · 6 con horario</p>
<div class="board">
<div class="hd"><span>DÍA</span><span>HORA</span><span>PUEDEN</span><span>ESTADO</span></div>
<div class="r"><span class="f">SÁ 12</span><span class="f">19:00</span><span class="f">6/7</span><span class="s am">FALTA CARO</span></div>
<div class="r"><span class="f">VI 18</span><span class="f">20:00</span><span class="f">5/7</span><span class="s am">FALTAN 2</span></div>
<div class="r"><span class="f">DO 13</span><span class="f">13:00</span><span class="f">5/7</span><span class="s am">FALTAN 2</span></div>
<div class="r"><span class="f">JU 17</span><span class="f">21:00</span><span class="f">4/7</span><span class="s am">FALTAN 3</span></div>
<div class="r"><span class="f">SÁ 19</span><span class="f">18:30</span><span class="f">6/7</span><span class="s ok">CONFIRMADO</span></div>
</div>
<div class="cta">Proponer el sábado 12</div>
</body></html>
