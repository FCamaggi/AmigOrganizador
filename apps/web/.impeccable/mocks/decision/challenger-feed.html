<!doctype html><html lang="es-CL"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#ff3b5c,#b3123a);color:#fff;font-family:Manrope,sans-serif;position:relative}
.top{padding:18px 20px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.g{padding:6px 20px;font-size:15px;opacity:.85}
.big{position:absolute;left:20px;right:84px;bottom:190px}
.big small{font-size:14px;font-weight:700;opacity:.85}
.big b{display:block;font-size:56px;font-weight:800;line-height:.95;margin:6px 0}
.big span{font-size:18px;font-weight:700}
.av{position:absolute;left:20px;bottom:130px;display:flex}
.av i{width:36px;height:36px;border-radius:50%;background:#fff;color:#b3123a;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;margin-right:-8px;border:2px solid #b3123a}
.av i.x{background:transparent;color:#fff;border:2px dashed #fff}
.rail{position:absolute;right:14px;bottom:200px;display:flex;flex-direction:column;gap:22px;align-items:center;font-size:12px;font-weight:700}
.rail i{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);display:block}
.cta{position:absolute;left:20px;right:20px;bottom:40px;height:54px;border-radius:27px;background:#fff;color:#b3123a;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
.peek{position:absolute;left:0;right:0;bottom:0;height:14px;background:#2f6bff}
</style></head><body>
<div class="top"><span>‹ Pichanga de los jueves</span><span>1 / 5</span></div>
<p class="g">7 personas · 6 con horario</p>
<div class="big"><small>EL MEJOR DÍA</small><b>Sábado 12</b><span>19:00 – 23:00 · pueden 6 de 7</span></div>
<div class="av"><i>A</i><i>B</i><i>D</i><i>E</i><i>F</i><i>T</i><i class="x">C</i></div>
<div class="rail"><div><i></i>Proponer</div><div><i></i>Compartir</div><div><i></i>Quién falta</div></div>
<div class="cta">Proponer este día</div>
<div class="peek"></div>
</body></html>
